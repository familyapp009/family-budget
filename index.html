<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16352d">
  <meta name="description" content="Private, shared family spending guidelines.">
  <meta name="application-version" content="20260929-auto-update-1">
  <title>Family Budget</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20260929-auto-update-1">
  <script type="module">
    // On an iPhone Home Screen launch, always request fresh application code.
    // Install a same-origin network-only worker to intercept stale shortcut URLs.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js",{updateViaCache:"none"}).catch(()=>{});
    }
    const entry=new URL("./app.js",location.href);
    entry.searchParams.set("startup",String(Date.now()));
    import(entry.href).catch(()=>{
      const root=document.querySelector("#app");
      if(root)root.textContent="The application could not load. Check your connection and refresh.";
    });
  </script>
</head>
<body>
  <div id="pull-refresh" class="pull-refresh" role="status" aria-live="polite" aria-atomic="true">↓ Pull to refresh</div>
  <div class="shell">
    <header class="site-header">
      <div class="brand">
        <span class="brand-symbol" aria-hidden="true">◈</span>
        <div><strong>Family Budget</strong><span>Make the month manageable</span></div>
      </div>
      <div class="header-tools" id="header-tools"></div>
    </header>
    <main id="app" class="main" aria-live="polite"><p class="muted">Loading budget…</p></main>
    <footer>Private household records are stored in Supabase. No banking connection or savings tracking.</footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
